[project]
name = "obsidian-vault-rag"
version = "0.1.0"
description = "Incremental local RAG index and MCP server for an Obsidian vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "numpy>=2.0.0",
  "requests>=2.32.0",
]

[project.scripts]
obsidian-rag = "obsidian_rag.cli:main"
obsidian-rag-mcp = "obsidian_rag.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obsidian_rag"]
